
name: Actualizar IB3 Televisio

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar yt-dlp y Deno
        run: |
          python -m pip install --upgrade "yt-dlp[default]"
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Obtener enlaces HLS
        shell: bash
        run: |
          set -euo pipefail

          VIDEO="https://www.youtube.com/watch?v=_EyRd_Al3mI"

          yt-dlp --js-runtimes deno -g -f 270 "$VIDEO" > video.url
          yt-dlp --js-runtimes deno -g -f 234 "$VIDEO" > audio.url

          test -s video.url
          test -s audio.url

          {
            echo "#EXTM3U"
            echo "#EXTINF:-1 tvg-name=\"IB3 Televisio\" group-title=\"Autonomicas\",IB3 Televisio HD"
            cat video.url
          } > IB3.m3u

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IB3.m3u video.url audio.url
          git diff --cached --quiet || git commit -m "Actualizar enlaces IB3"
          git push
